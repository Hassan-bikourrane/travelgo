
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelGo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-[#FAF7F2] text-[#302923]">

    <nav class="flex justify-between items-center px-8 py-5 bg-[#302923] text-white">

        <h1 class="text-2xl font-serif font-bold">
            TravelGo.
        </h1>

        <ul class="flex items-center gap-8 list-none">
            <li><a href="#home" class="hover:text-[#D5AA83] transition">Home</a></li>
            <li><a href="#destinations" class="hover:text-[#D5AA83] transition">Destinations</a></li>
            <li><a href="#about" class="hover:text-[#D5AA83] transition">About</a></li>
        </ul>

        <button class="bg-[#FAF7F2] text-[#8C4938] px-5 py-2 rounded-md hover:bg-[#EADFD2] transition">
            Contact
        </button>

    </nav>

    <header id="home"
        class="h-[450px] bg-[url('./imgs/your-image.jpg')] bg-cover bg-center">

        <div class="h-full bg-black/40 flex flex-col justify-center items-center text-center px-4">

            <h2 class="text-white text-5xl font-serif font-bold">
                Discover Morocco
            </h2>

            <p class="text-white text-xl mt-4">
                Your next adventure starts here.
            </p>

            <button class="bg-[#8C4938] text-white px-8 py-3 mt-6 rounded-md hover:bg-[#71392D] transition">
                Get Started
            </button>

        </div>

    </header>

    <section id="destinations" class="py-12 px-8">

        <h2 class="text-3xl font-serif text-center mb-10">
            Popular destinations
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">

            <div class="bg-white p-4 rounded-lg shadow-md">

                <img src="./imgs/marrakech.jpg" alt="Marrakech"
                    class="w-full h-48 object-cover rounded-md">

                <h3 class="text-xl font-serif mt-4">
                    Marrakech
                </h3>

                <p class="text-[#8C4938] mt-2">
                    500 DH
                </p>

                <button class="bg-[#8C4938] text-white w-full py-2 mt-4 rounded-md hover:bg-[#71392D] transition">
                    Book now
                </button>

            </div>

            <div class="bg-white p-4 rounded-lg shadow-md">

                <img src="./imgs/chefchaouen.jpg" alt="Chefchaouen"
                    class="w-full h-48 object-cover rounded-md">

                <h3 class="text-xl font-serif mt-4">
                    Chefchaouen
                </h3>

                <p class="text-[#8C4938] mt-2">
                    700 DH
                </p>

                <button class="bg-[#8C4938] text-white w-full py-2 mt-4 rounded-md hover:bg-[#71392D] transition">
                    Book now
                </button>

            </div>

            <div class="bg-white p-4 rounded-lg shadow-md ">

                <img src="./imgs/agadir.jpg" alt="Agadir"
                    class="w-full h-48 object-cover rounded-md">

                <h3 class="text-xl font-serif mt-4">
                    Agadir
                </h3>

                <p class="text-[#8C4938] mt-2">
                    600 DH
                </p>

                <button class="bg-[#8C4938] text-white w-full py-2 mt-4 rounded-md hover:bg-[#71392D] transition">
                    Book now
                </button>

            </div>

        </div>

    </section>

    <section id="about" class="bg-[#EADFD2] py-12 text-center px-4">

        <h2 class="text-3xl font-serif mb-4">
            About us
        </h2>

        <p class="text-[#625348]">
            We help you discover beautiful destinations in Morocco.
        </p>

    </section>

    <footer class="bg-[#302923] text-white text-center py-4">

        <p>
            &copy; 2026 TravelGo
        </p>

    </footer>

    <script src="script.js"></script>

</body>
</html>
